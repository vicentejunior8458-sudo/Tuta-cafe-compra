<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuta Café | Broker App</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3e2723; --accent: #8d6e63; --bg: #f8f9fa; --success: #2e7d32; --pending: #c62828; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #212529; }
        
        .app-header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .app-header h1 { margin: 0; font-size: 26px; letter-spacing: 2px; font-weight: 700; }
        
        .container { max-width: 500px; margin: -20px auto 40px; padding: 0 15px; }
        
        /* Cotações */
        .price-panel { background: white; border-radius: 20px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .price-card span { display: block; font-size: 10px; color: #888; font-weight: 700; text-transform: uppercase; }
        .price-card strong { font-size: 14px; color: var(--primary); }

        /* Estrutura Original de Fieldsets/Cards */
        .glass-card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .section-tag { display: inline-block; background: #efebe9; color: var(--primary); font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px; margin-bottom: 15px; }
        
        label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; margin-left: 2px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fcfcfc; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 10px 20px rgba(62, 39, 35, 0.2); }

        /* Histórico */
        .history-item { background: #fff; border-left: 5px solid var(--primary); padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; }
        .status-badge { float: right; font-size: 10px; padding: 3px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .bg-pago { background: var(--success); }
        .bg-pendente { background: var(--pending); }

        #msgSucesso { display:none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

<div id="msgSucesso">✅ COMPRA REGISTRADA!</div>

<header class="app-header">
    <h1>TUTA CAFÉ</h1>
    <div id="statusLogin" style="display:none; font-size: 12px; margin-top: 10px; opacity: 0.8;">
        CORRETOR: <span id="nomeExibicao" style="font-weight: 800;"></span>
    </div>
</header>

<div class="container">
    
    <div id="loginArea" class="glass-card" style="text-align:center; margin-top: 40px;">
        <span class="section-tag">ACESSO RESTRITO</span>
        <input type="text" id="l_user" placeholder="Usuário">
        <input type="password" id="l_pass" placeholder="Senha">
        <button class="btn-submit" onclick="fazerLogin()">ENTRAR</button>
    </div>

    <div id="mainArea" style="display:none; margin-top: 20px;">
        
        <div class="price-panel">
            <div class="price-card"><span>NOVO 200</span><strong id="v1">---</strong></div>
            <div class="price-card"><span>VELHO 200</span><strong id="v2">---</strong></div>
            <div class="price-card"><span>ATÉ 300</span><strong id="v3">---</strong></div>
        </div>

        <form id="formCompra">
            <div class="glass-card">
                <span class="section-tag">01. INFORMAÇÕES DO PRODUTOR</span>
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
                <div class="grid">
                    <div><label>CPF/CNPJ</label><input type="text" id="cpf" inputmode="numeric" required></div>
                    <div><label>Senha SEFAZ</label><input type="text" id="sefaz" required></div>
                </div>
            </div>

            <div class="glass-card">
                <span class="section-tag">02. DADOS PARA PAGAMENTO</span>
                <label>Instituição Bancária</label>
                <select id="banco">
                    <option value="756 - SICOOB">756 - SICOOB</option>
                    <option value="748 - SICREDI">748 - SICREDI</option>
                    <option value="001 - BANCO DO BRASIL">001 - BANCO DO BRASIL</option>
                    <option value="237 - BRADESCO">237 - BRADESCO</option>
                    <option value="104 - CAIXA ECONÔMICA">104 - CAIXA ECONÔMICA</option>
                    <option value="260 - NUBANK">260 - NUBANK</option>
                </select>
                <div class="grid">
                    <div><label>Agência</label><input type="text" id="agencia" inputmode="numeric" required></div>
                    <div><label>Conta</label><input type="text" id="conta" inputmode="numeric" required></div>
                </div>
            </div>

            <div class="glass-card">
                <span class="section-tag">03. DETALHES DA CARGA</span>
                <label>Classificação</label>
                <select id="tipoCafe">
                    <option>Café Novo (até 200 def)</option>
                    <option>Café Velho (até 200 def)</option>
                    <option>Café (até 300 def)</option>
                </select>
                <div class="grid">
                    <div><label>Quantidade</label><input type="number" id="qtd" step="0.1" required></div>
                    <div><label>Unidade</label><select id="unidade"><option>Sacas</option><option>Kg</option></select></div>
                </div>
                <label>Armazém / Local de Retirada</label>
                <input type="text" id="armazem" required>
                <label>Observações</label>
                <textarea id="obs" rows="2"></textarea>
            </div>

            <button type="submit" id="btnSalvar" class="btn-submit">FINALIZAR REGISTRO</button>
        </form>

        <div class="glass-card">
            <span class="section-tag">HISTÓRICO RECENTE</span>
            <input type="text" id="inputBusca" placeholder="🔍 Buscar no histórico..." onkeyup="filtrarHistorico()" style="margin-bottom: 15px;">
            <div id="listaHistorico"></div>
        </div>

        <p onclick="logout()" style="text-align:center; color:#999; font-size:12px; cursor:pointer; margin-bottom: 30px;">Encerrar Sessão</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDE87l7QnjS48AT8jLOGLBDP2vwyGyHNEs",
        authDomain: "sistemacafe-e4a42.firebaseapp.com",
        databaseURL: "https://sistemacafe-e4a42-default-rtdb.firebaseio.com", 
        projectId: "sistemacafe-e4a42",
        storageBucket: "sistemacafe-e4a42.firebasestorage.app",
        messagingSenderId: "483940361596",
        appId: "1:483940361596:web:4418541808c717276c70f9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let user = localStorage.getItem('tuta_user');
    if(user) { carregarPagina(user); }

    function fazerLogin() {
        const u = document.getElementById('l_user').value.toLowerCase().trim();
        const s = document.getElementById('l_pass').value.trim();
        database.ref('usuarios/' + u).once('value', snap => {
            if(snap.exists() && snap.val().senha === s) {
                localStorage.setItem('tuta_user', u);
                carregarPagina(u);
            } else { alert("Acesso Negado!"); }
        });
    }

    function carregarPagina(nome) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('statusLogin').style.display = 'block';
        document.getElementById('nomeExibicao').innerText = nome.toUpperCase();
        
        database.ref('precos').on('value', snap => {
            const p = snap.val();
            if(p){
                document.getElementById('v1').innerText = "R$ " + p.novo200;
                document.getElementById('v2').innerText = "R$ " + p.velho200;
                document.getElementById('v3').innerText = "R$ " + p.def300;
            }
        });
        carregarHistorico(nome);
    }

    function carregarHistorico(corretor) {
        database.ref('compras').on('value', snap => {
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = "";
            let regs = [];
            snap.forEach(i => { if(i.val().corretor === corretor) regs.push(i.val()); });
            regs.reverse().forEach(v => {
                const badge = v.status === 'PAGO' ? 'bg-pago' : 'bg-pendente';
                lista.innerHTML += `
                    <div class="history-item">
                        <span class="status-badge ${badge}">${v.status}</span>
                        <strong>${v.nome}</strong><br>
                        <small>${v.dataHr} | ${v.qtd} ${v.unidade}</small>
                    </div>`;
            });
        });
    }

    function filtrarHistorico() {
        const termo = document.getElementById('inputBusca').value.toLowerCase();
        const itens = document.getElementsByClassName('history-item');
        Array.from(itens).forEach(i => {
            i.style.display = i.innerText.toLowerCase().includes(termo) ? 'block' : 'none';
        });
    }

    function logout() { localStorage.removeItem('tuta_user'); location.reload(); }

    document.getElementById('formCompra').onsubmit = (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.disabled = true;

        const data = {
            corretor: localStorage.getItem('tuta_user'),
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            sefaz: document.getElementById('sefaz').value,
            banco: document.getElementById('banco').value,
            agencia: document.getElementById('agencia').value,
            conta: document.getElementById('conta').value,
            tipoCafe: document.getElementById('tipoCafe').value,
            qtd: document.getElementById('qtd').value,
            unidade: document.getElementById('unidade').value,
            armazem: document.getElementById('armazem').value,
            observacao: document.getElementById('obs').value,
            status: "PENDENTE",
            dataHr: new Date().toLocaleString('pt-BR')
        };

        database.ref('compras').push(data).then(() => {
            document.getElementById('formCompra').reset();
            const msg = document.getElementById('msgSucesso');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; btn.disabled = false; }, 2500);
        });
    };
</script>
</body>
</html>
