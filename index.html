<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuta Café | Operacional</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3e2723; --accent: #8d6e63; --bg: #f8f9fa; --success: #2e7d32; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #212529; }
        .app-header { background: var(--primary); color: white; padding: 25px 20px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .container { max-width: 500px; margin: -20px auto 40px; padding: 0 15px; }
        .price-panel { background: white; border-radius: 20px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .price-card span { display: block; font-size: 9px; color: #888; font-weight: 800; text-transform: uppercase; margin-bottom: 5px;}
        .price-card strong { font-size: 15px; color: var(--primary); }
        .glass-card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .section-tag { display: inline-block; background: #efebe9; color: var(--primary); font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 20px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; background: #fcfcfc; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; }
        .history-item { background: #fff; border-left: 5px solid var(--primary); padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; font-size: 13px; }
    </style>
</head>
<body>
<header class="app-header">
    <h1>TUTA CAFÉ</h1>
    <div id="statusLogin" style="display:none; font-size: 11px; margin-top: 8px;">OPERADOR: <span id="nomeExibicao" style="font-weight:800"></span></div>
</header>

<div class="container">
    <div id="loginArea" class="glass-card" style="text-align:center; margin-top: 40px;">
        <span class="section-tag">ACESSO RESTRITO</span>
        <input type="text" id="l_user" placeholder="Usuário">
        <input type="password" id="l_pass" placeholder="Senha">
        <button class="btn-submit" onclick="fazerLogin()">ENTRAR NO SISTEMA</button>
    </div>

    <div id="mainArea" style="display:none; margin-top: 20px;">
        <div class="price-panel">
            <div class="price-card"><span>A RETIRAR</span><strong id="v1">R$ 0,00</strong></div>
            <div class="price-card"><span>ARMAZÉM</span><strong id="v2">R$ 0,00</strong></div>
        </div>

        <form id="formCompra">
            <div class="glass-card">
                <span class="section-tag">01. PRODUTOR</span>
                <input type="text" id="nome" placeholder="Nome" required>
                <div class="grid">
                    <input type="text" id="cpf" placeholder="CPF/CNPJ" required>
                    <input type="text" id="sefaz" placeholder="Senha SEFAZ" required>
                </div>
            </div>

            <div class="glass-card">
                <span class="section-tag">02. PAGAMENTO</span>
                <input type="text" id="banco" list="listaBancos" placeholder="Digite ou selecione o banco" required>
                <datalist id="listaBancos">
                    <option value="756 - SICOOB"><option value="748 - SICREDI"><option value="133 - CRESOL"><option value="001 - BANCO DO BRASIL"><option value="237 - BRADESCO"><option value="104 - CAIXA ECONÔMICA"><option value="033 - SANTANDER"><option value="260 - NUBANK">
                </datalist>
                <div class="grid">
                    <input type="text" id="agencia" placeholder="Agência" required>
                    <input type="text" id="conta" placeholder="Conta" required>
                </div>
            </div>

            <div class="glass-card">
                <span class="section-tag">03. CARGA</span>
                <div class="grid">
                    <input type="number" id="qtdSacas" placeholder="Sacas" required>
                    <input type="number" id="qtdKg" placeholder="Kg">
                </div>
                <input type="text" id="valorSaca" oninput="mascaraMoeda(this)" placeholder="Valor por Saca (R$)" required>
                <input type="text" id="armazem" placeholder="Local/Armazém" required>
                <textarea id="obs" placeholder="Observações"></textarea>
            </div>
            <button type="submit" class="btn-submit">REGISTRAR COMPRA</button>
        </form>

        <h3 style="margin-top:30px; font-size: 14px;">MINHAS ÚLTIMAS COMPRAS:</h3>
        <div id="listaHistorico"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDE87l7QnjS48AT8jLOGLBDP2vwyGyHNEs",
        authDomain: "sistemacafe-e4a42.firebaseapp.com",
        databaseURL: "https://sistemacafe-e4a42-default-rtdb.firebaseio.com", 
        projectId: "sistemacafe-e4a42",
        storageBucket: "sistemacafe-e4a42.firebasestorage.app",
        messagingSenderId: "483940361596",
        appId: "1:483940361596:web:4418541808c717276c70f9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function mascaraMoeda(i) {
        let v = i.value.replace(/\D/g,'');
        v = (v/100).toFixed(2) + '';
        v = v.replace(".", ",");
        v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
        v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
        i.value = v !== "0.00" ? "R$ " + v : "";
    }

    function formatarMoeda(v) {
        return parseFloat(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function limparValor(v) {
        return parseFloat(v.replace("R$ ", "").replace(/\./g, "").replace(",", "."));
    }

    function fazerLogin() {
        const u = document.getElementById('l_user').value.toLowerCase().trim();
        const s = document.getElementById('l_pass').value.trim();
        database.ref('usuarios/' + u).once('value', snap => {
            if(snap.exists() && snap.val().senha === s) {
                localStorage.setItem('tuta_user', u);
                carregarPagina(u);
            } else { alert("Acesso negado!"); }
        });
    }

    function carregarPagina(nome) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('statusLogin').style.display = 'block';
        document.getElementById('nomeExibicao').innerText = nome.toUpperCase();
        
        database.ref('precos').on('value', snap => {
            const p = snap.val();
            if(p){
                document.getElementById('v1').innerText = formatarMoeda(p.retirar);
                document.getElementById('v2').innerText = formatarMoeda(p.armazem);
            }
        });

        database.ref('compras').on('value', snap => {
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = "";
            snap.forEach(item => {
                const v = item.val();
                if(v.corretor === nome) {
                    lista.innerHTML = `<div class="history-item">
                        <strong>${v.nome}</strong><br>
                        ${v.qtdSacas} sacas - ${v.status} em ${v.dataHr}
                    </div>` + lista.innerHTML;
                }
            });
        });
    }

    if(localStorage.getItem('tuta_user')) carregarPagina(localStorage.getItem('tuta_user'));

    document.getElementById('formCompra').onsubmit = (e) => {
        e.preventDefault();
        const data = {
            corretor: localStorage.getItem('tuta_user'),
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            sefaz: document.getElementById('sefaz').value,
            banco: document.getElementById('banco').value,
            agencia: document.getElementById('agencia').value,
            conta: document.getElementById('conta').value,
            qtdSacas: document.getElementById('qtdSacas').value,
            qtdKg: document.getElementById('qtdKg').value || 0,
            valorSaca: limparValor(document.getElementById('valorSaca').value),
            armazem: document.getElementById('armazem').value,
            observacao: document.getElementById('obs').value,
            status: "PENDENTE",
            dataHr: new Date().toLocaleString('pt-BR')
        };
        database.ref('compras').push(data).then(() => {
            alert("Sucesso!");
            document.getElementById('formCompra').reset();
        });
    };
</script>
</body>
</html>
