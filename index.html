<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operacional | Tuta Café</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3e2723; --secondary: #8d6e63; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* Header e Logout */
        .header { background: var(--primary); color: white; padding: 35px 20px; text-align: center; border-radius: 0 0 30px 30px; position: relative; }
        .logout-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; }
        
        .container { max-width: 480px; margin: -30px auto 50px; padding: 0 15px; }
        
        .session-card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .session-header { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .session-number { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-right: 10px; }
        .session-title { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; }

        input, select { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; box-sizing: border-box; background: #f9f9f9; font-family: inherit; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 5px 15px rgba(62,39,35,0.3); }
        
        /* Modal de Histórico */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg); margin: 10% auto; padding: 20px; width: 90%; max-width: 450px; border-radius: 20px; max-height: 70vh; overflow-y: auto; }
        .history-card { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--secondary); font-size: 12px; }
        
        .history-trigger { background: var(--secondary); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="loginArea" style="display:block">
    <div class="header"><h1>TUTA CAFÉ</h1></div>
    <div class="container">
        <div class="session-card" style="margin-top: 50px; text-align: center;">
            <h2 style="font-size: 16px; margin-bottom: 20px;">ACESSO DO CORRETOR</h2>
            <input type="text" id="l_user" placeholder="Usuário">
            <input type="password" id="l_pass" placeholder="Senha">
            <button class="btn-submit" onclick="fazerLogin()">ENTRAR</button>
        </div>
    </div>
</div>

<div id="mainArea" style="display:none">
    <div class="header">
        <button class="logout-btn" onclick="logout()">SAIR / LOGOUT</button>
        <h1>TUTA CAFÉ | COMPRAS</h1>
        <div style="font-size: 11px; margin-top: 8px; opacity: 0.8;">CORRETOR: <span id="userName" style="font-weight:700"></span></div>
    </div>

    <div class="container">
        <form id="formCompra">
            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">1</div><div class="session-title">Produtor</div>
                </div>
                <input type="text" id="nome" placeholder="Nome Completo" required>
                <div class="grid">
                    <input type="text" id="cpf" placeholder="CPF/CNPJ">
                    <input type="text" id="sefaz" placeholder="Senha SEFAZ">
                </div>
            </div>

            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">2</div><div class="session-title">Pagamento</div>
                </div>
                <input type="text" id="banco" placeholder="Banco">
                <div class="grid">
                    <input type="text" id="agencia" placeholder="Agência">
                    <input type="text" id="conta" placeholder="Conta">
                </div>
            </div>

            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">3</div><div class="session-title">Carga e Valor</div>
                </div>
                <div class="grid">
                    <input type="number" id="qtdSacas" placeholder="Sacas" required>
                    <input type="number" id="qtdKg" placeholder="Kg Extras">
                </div>

                <div style="background: #fdfaf9; padding: 15px; border-radius: 15px; border: 1px solid #efebe9; margin-bottom: 15px;">
                    <label style="font-size: 10px; font-weight: bold; color: var(--secondary); margin-bottom: 8px; display: block;">TIPO DE COTAÇÃO E VALOR</label>
                    <select id="tipoCotacao" onchange="puxarPrecoAutomatico()" style="margin-bottom: 10px;">
                        <option value="">Negociação Manual...</option>
                        <option value="retirar">A Retirar (Cotação do Dia)</option>
                        <option value="armazem">Posto Armazém (Cotação do Dia)</option>
                    </select>
                    <input type="text" id="valorSaca" oninput="mascaraMoeda(this)" placeholder="Valor por Saca (R$)" required>
                </div>

                <label style="font-size: 10px; font-weight: bold; color: var(--secondary);">LOCAL DE BUSCA (FAZENDA/PONTO)</label>
                <input type="text" id="localBusca" placeholder="Ex: Fazenda Santa Maria, KM 12..." required>
            </div>

            <button type="submit" class="btn-submit">SALVAR COMPRA</button>
            <button type="button" class="history-trigger" onclick="abrirHistorico()">VER MINHAS COMPRAS</button>
        </form>
    </div>
</div>

<div id="modalHist" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3 style="margin:0; font-size:16px;">Meu Histórico</h3>
            <button onclick="fecharHistorico()" style="background:none; border:none; font-weight:bold; cursor:pointer;">X FECHAR</button>
        </div>
        <div id="listaHistorico"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDE87l7QnjS48AT8jLOGLBDP2vwyGyHNEs",
        authDomain: "sistemacafe-e4a42.firebaseapp.com",
        databaseURL: "https://sistemacafe-e4a42-default-rtdb.firebaseio.com", 
        projectId: "sistemacafe-e4a42",
        storageBucket: "sistemacafe-e4a42.firebasestorage.app",
        messagingSenderId: "483940361596",
        appId: "1:483940361596:web:4418541808c717276c70f9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let precosDB = { retirar: 0, armazem: 0 };

    function mascaraMoeda(i) {
        let v = i.value.replace(/\D/g,'');
        v = (v/100).toFixed(2) + '';
        v = v.replace(".", ",");
        v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
        v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
        i.value = v !== "0,00" ? "R$ " + v : "";
    }

    function formatarMoeda(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

    function puxarPrecoAutomatico() {
        const tipo = document.getElementById('tipoCotacao').value;
        const campoValor = document.getElementById('valorSaca');
        if(tipo === 'retirar') campoValor.value = formatarMoeda(precosDB.retirar);
        if(tipo === 'armazem') campoValor.value = formatarMoeda(precosDB.armazem);
    }

    function fazerLogin() {
        const u = document.getElementById('l_user').value.toLowerCase().trim();
        const s = document.getElementById('l_pass').value.trim();
        database.ref('usuarios/' + u).once('value', snap => {
            if(snap.exists() && snap.val().senha === s) {
                localStorage.setItem('tuta_user', u);
                location.reload();
            } else { alert("Acesso inválido!"); }
        });
    }

    function logout() { localStorage.removeItem('tuta_user'); location.reload(); }

    const logado = localStorage.getItem('tuta_user');
    if(logado) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('userName').innerText = logado.toUpperCase();

        database.ref('precos').on('value', snap => { if(snap.val()) precosDB = snap.val(); });

        database.ref('compras').on('value', snap => {
            const list = document.getElementById('listaHistorico');
            list.innerHTML = "";
            snap.forEach(item => {
                const v = item.val();
                if(v.corretor === logado) {
                    list.innerHTML = `<div class="history-card">
                        <strong>${v.nome}</strong><br>${v.qtdSacas} sacas - ${formatarMoeda(v.valorSaca || 0)}<br>
                        <small>${v.dataHr} | ${v.status}</small>
                    </div>` + list.innerHTML;
                }
            });
        });
    }

    function abrirHistorico() { document.getElementById('modalHist').style.display = 'block'; }
    function fecharHistorico() { document.getElementById('modalHist').style.display = 'none'; }

    document.getElementById('formCompra').onsubmit = (e) => {
        e.preventDefault();
        const vSaca = parseFloat(document.getElementById('valorSaca').value.replace(/[^\d,]/g, '').replace(',', '.'));
        const data = {
            corretor: logado,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            sefaz: document.getElementById('sefaz').value,
            banco: document.getElementById('banco').value,
            agencia: document.getElementById('agencia').value,
            conta: document.getElementById('conta').value,
            qtdSacas: document.getElementById('qtdSacas').value,
            qtdKg: document.getElementById('qtdKg').value || 0,
            valorSaca: vSaca,
            armazem: document.getElementById('localBusca').value,
            status: "PENDENTE",
            dataHr: new Date().toLocaleString('pt-BR')
        };
        database.ref('compras').push(data).then(() => {
            alert("Compra salva!");
            document.getElementById('formCompra').reset();
        });
    };
</script>
</body>
</html>
