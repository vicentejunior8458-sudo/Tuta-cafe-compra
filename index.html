<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operacional | Tuta Café</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3e2723; --secondary: #8d6e63; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        .header { background: var(--primary); color: white; padding: 35px 20px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 1px; }

        .container { max-width: 480px; margin: -30px auto 50px; padding: 0 15px; }
        
        /* Painel de Preços */
        .price-panel { background: var(--white); border-radius: 20px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .price-box { background: #fdfaf9; border: 1px solid #efebe9; padding: 12px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .price-box:hover { background: #efebe9; }
        .price-box small { font-size: 9px; color: var(--secondary); font-weight: 700; text-transform: uppercase; display: block; }
        .price-box strong { font-size: 15px; color: var(--primary); }

        /* Sessões do Formulário */
        .session-card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .session-header { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .session-number { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-right: 10px; }
        .session-title { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        input, select { width: 100%; padding: 14px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; box-sizing: border-box; background: #f9f9f9; transition: 0.3s; font-family: inherit; }
        input:focus { border-color: var(--secondary); outline: none; background: #fff; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-submit { background: var(--primary); color: white; border: none; padding: 20px; border-radius: 15px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 5px 15px rgba(62,39,35,0.3); transition: 0.3s; }
        .btn-submit:active { transform: scale(0.98); }
        
        .history-section { margin-top: 30px; }
        .history-card { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 6px solid var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    </style>
</head>
<body>

<div class="header">
    <h1>TUTA CAFÉ | COMPRAS</h1>
    <div id="userLabel" style="display:none; font-size: 11px; margin-top: 8px; opacity: 0.8;">LOGADO COMO: <span id="userName" style="font-weight:700"></span></div>
</div>

<div class="container">
    <div id="loginArea" class="session-card" style="margin-top: 50px; text-align: center;">
        <h2 style="font-size: 16px; margin-bottom: 20px;">ACESSO OPERACIONAL</h2>
        <input type="text" id="l_user" placeholder="Usuário">
        <input type="password" id="l_pass" placeholder="Senha">
        <button class="btn-submit" onclick="fazerLogin()">ENTRAR NO SISTEMA</button>
    </div>

    <div id="mainArea" style="display:none">
        <div class="price-panel">
            <div class="price-box" onclick="aplicarPreco('retirar')">
                <small>A Retirar (Hoje)</small>
                <strong id="v1">R$ 0,00</strong>
            </div>
            <div class="price-box" onclick="aplicarPreco('armazem')">
                <small>Posto Armazém</small>
                <strong id="v2">R$ 0,00</strong>
            </div>
        </div>

        <form id="formCompra">
            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">1</div>
                    <div class="session-title">Identificação do Produtor</div>
                </div>
                <input type="text" id="nome" placeholder="Nome Completo do Produtor" required>
                <div class="grid">
                    <input type="text" id="cpf" placeholder="CPF ou CNPJ">
                    <input type="text" id="sefaz" placeholder="Senha SEFAZ">
                </div>
            </div>

            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">2</div>
                    <div class="session-title">Dados Bancários para PGTO</div>
                </div>
                <input type="text" id="banco" list="listaBancos" placeholder="Selecione o Banco">
                <datalist id="listaBancos">
                    <option value="SICOOB"> <option value="SICREDI"> <option value="CRESOL"> <option value="BANCO DO BRASIL"> <option value="BRADESCO">
                </datalist>
                <div class="grid">
                    <input type="text" id="agencia" placeholder="Agência">
                    <input type="text" id="conta" placeholder="Nº da Conta">
                </div>
            </div>

            <div class="session-card">
                <div class="session-header">
                    <div class="session-number">3</div>
                    <div class="session-title">Detalhes da Carga e Valor</div>
                </div>
                <div class="grid">
                    <input type="number" id="qtdSacas" placeholder="Sacas" required>
                    <input type="number" id="qtdKg" placeholder="Kg Extras">
                </div>
                
                <label style="font-size: 10px; font-weight: bold; color: var(--secondary);">VALOR POR SACA (R$)</label>
                <input type="text" id="valorSaca" oninput="mascaraMoeda(this)" placeholder="R$ 0,00" required>
                
                <label style="font-size: 10px; font-weight: bold; color: var(--secondary);">LOCAL DE ENTREGA</label>
                <select id="armazem" onchange="sugerirPrecoPorLocal()">
                    <option value="">Selecione o Local...</option>
                    <option value="A RETIRAR">A RETIRAR (NA FAZENDA)</option>
                    <option value="POSTO ARMAZÉM">POSTO ARMAZÉM (ENTREGA)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">FINALIZAR E SALVAR REGISTRO</button>
        </form>

        <div class="history-section">
            <h3 style="font-size: 14px; color: var(--primary);">MINHAS COMPRAS RECENTES</h3>
            <div id="listaHistorico"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDE87l7QnjS48AT8jLOGLBDP2vwyGyHNEs",
        authDomain: "sistemacafe-e4a42.firebaseapp.com",
        databaseURL: "https://sistemacafe-e4a42-default-rtdb.firebaseio.com", 
        projectId: "sistemacafe-e4a42",
        storageBucket: "sistemacafe-e4a42.firebasestorage.app",
        messagingSenderId: "483940361596",
        appId: "1:483940361596:web:4418541808c717276c70f9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let precosAtuais = { retirar: 0, armazem: 0 };

    function mascaraMoeda(i) {
        let v = i.value.replace(/\D/g,'');
        v = (v/100).toFixed(2) + '';
        v = v.replace(".", ",");
        v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
        v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
        i.value = v !== "0,00" ? "R$ " + v : "";
    }

    function formatarParaMoeda(v) {
        return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Puxa o preço conforme o local selecionado
    function sugerirPrecoPorLocal() {
        const local = document.getElementById('armazem').value;
        const campoValor = document.getElementById('valorSaca');
        
        if (local === "A RETIRAR") {
            campoValor.value = formatarParaMoeda(precosAtuais.retirar);
        } else if (local === "POSTO ARMAZÉM") {
            campoValor.value = formatarParaMoeda(precosAtuais.armazem);
        }
    }

    function aplicarPreco(tipo) {
        const campoValor = document.getElementById('valorSaca');
        const campoLocal = document.getElementById('armazem');
        if(tipo === 'retirar') {
            campoValor.value = formatarParaMoeda(precosAtuais.retirar);
            campoLocal.value = "A RETIRAR";
        } else {
            campoValor.value = formatarParaMoeda(precosAtuais.armazem);
            campoLocal.value = "POSTO ARMAZÉM";
        }
    }

    function fazerLogin() {
        const u = document.getElementById('l_user').value.toLowerCase().trim();
        const s = document.getElementById('l_pass').value.trim();
        database.ref('usuarios/' + u).once('value', snap => {
            if(snap.exists() && snap.val().senha === s) {
                localStorage.setItem('tuta_user', u);
                location.reload();
            } else { alert("Usuário ou Senha incorretos!"); }
        });
    }

    const logado = localStorage.getItem('tuta_user');
    if(logado) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('userLabel').style.display = 'block';
        document.getElementById('userName').innerText = logado.toUpperCase();

        database.ref('precos').on('value', snap => {
            const p = snap.val();
            if(p){
                precosAtuais = p;
                document.getElementById('v1').innerText = formatarParaMoeda(p.retirar);
                document.getElementById('v2').innerText = formatarParaMoeda(p.armazem);
            }
        });

        database.ref('compras').on('value', snap => {
            const list = document.getElementById('listaHistorico');
            list.innerHTML = "";
            snap.forEach(item => {
                const v = item.val();
                if(v.corretor === logado) {
                    list.innerHTML = `<div class="history-card">
                        <strong>${v.nome}</strong><br>
                        ${v.qtdSacas || v.qtd} sc | ${formatarParaMoeda(v.valorSaca || 0)}<br>
                        <small>${v.dataHr} - Status: ${v.status}</small>
                    </div>` + list.innerHTML;
                }
            });
        });
    }

    document.getElementById('formCompra').onsubmit = (e) => {
        e.preventDefault();
        const vSaca = parseFloat(document.getElementById('valorSaca').value.replace(/[^\d,]/g, '').replace(',', '.'));
        const data = {
            corretor: logado,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            sefaz: document.getElementById('sefaz').value,
            banco: document.getElementById('banco').value,
            agencia: document.getElementById('agencia').value,
            conta: document.getElementById('conta').value,
            qtdSacas: document.getElementById('qtdSacas').value,
            qtdKg: document.getElementById('qtdKg').value || 0,
            valorSaca: vSaca,
            armazem: document.getElementById('armazem').value,
            status: "PENDENTE",
            dataHr: new Date().toLocaleString('pt-BR')
        };
        database.ref('compras').push(data).then(() => {
            alert("Venda registrada com sucesso!");
            document.getElementById('formCompra').reset();
        });
    };
</script>
</body>
</html>
