<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuta Café | Operacional</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3e2723; --bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .app-header { background: var(--primary); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .glass-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .history-item { background: #fff; border-left: 5px solid var(--primary); padding: 10px; margin-bottom: 8px; border-radius: 5px; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<header class="app-header">
    <h1>TUTA CAFÉ</h1>
    <div id="infoUser" style="display:none; font-size: 12px;">Olá, <span id="userNome"></span></div>
</header>

<div class="container">
    <div id="loginArea" class="glass-card">
        <input type="text" id="l_user" placeholder="Usuário">
        <input type="password" id="l_pass" placeholder="Senha">
        <button class="btn-submit" onclick="fazerLogin()">ENTRAR</button>
    </div>

    <div id="mainArea" style="display:none">
        <div class="glass-card" style="display:grid; grid-template-columns: 1fr 1fr; text-align:center">
            <div><small>A RETIRAR</small><br><strong id="v1">R$ 0,00</strong></div>
            <div><small>ARMAZÉM</small><br><strong id="v2">R$ 0,00</strong></div>
        </div>

        <form id="formCompra" class="glass-card">
            <input type="text" id="nome" placeholder="Nome do Produtor" required>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <input type="text" id="cpf" placeholder="CPF/CNPJ">
                <input type="text" id="sefaz" placeholder="Senha SEFAZ">
            </div>
            <input type="text" id="banco" placeholder="Banco (Ex: Sicoob)">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <input type="text" id="agencia" placeholder="Agência">
                <input type="text" id="conta" placeholder="Conta">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <input type="number" id="qtdSacas" placeholder="Sacas" required>
                <input type="number" id="qtdKg" placeholder="Kg">
            </div>
            <input type="text" id="valorSaca" oninput="mascaraMoeda(this)" placeholder="Valor p/ Saca (R$)" required>
            <input type="text" id="armazem" placeholder="Local/Armazém" required>
            <button type="submit" class="btn-submit">SALVAR COMPRA</button>
        </form>

        <button onclick="toggleHistorial()" class="btn-submit" style="background:#8d6e63; margin-bottom:15px">VER COMPRAS ANTERIORES</button>
        <div id="listaHistorico" style="display:none"></div>
    </div>
</div>

<script>
    // Mesma configuração do Firebase do Admin
    const firebaseConfig = {
        apiKey: "AIzaSyDE87l7QnjS48AT8jLOGLBDP2vwyGyHNEs",
        authDomain: "sistemacafe-e4a42.firebaseapp.com",
        databaseURL: "https://sistemacafe-e4a42-default-rtdb.firebaseio.com", 
        projectId: "sistemacafe-e4a42",
        storageBucket: "sistemacafe-e4a42.firebasestorage.app",
        messagingSenderId: "483940361596",
        appId: "1:483940361596:web:4418541808c717276c70f9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function mascaraMoeda(i) {
        let v = i.value.replace(/\D/g,'');
        v = (v/100).toFixed(2) + '';
        v = v.replace(".", ",");
        v = v.replace(/(\d)(\d{3})(\d{3}),/g, "$1.$2.$3,");
        v = v.replace(/(\d)(\d{3}),/g, "$1.$2,");
        i.value = v !== "0,00" ? "R$ " + v : "";
    }

    function fazerLogin() {
        const u = document.getElementById('l_user').value.toLowerCase().trim();
        const s = document.getElementById('l_pass').value.trim();
        database.ref('usuarios/' + u).once('value', snap => {
            if(snap.exists() && snap.val().senha === s) {
                localStorage.setItem('tuta_user', u);
                location.reload();
            } else { alert("Acesso negado!"); }
        });
    }

    const logado = localStorage.getItem('tuta_user');
    if(logado) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('mainArea').style.display = 'block';
        document.getElementById('infoUser').style.display = 'block';
        document.getElementById('userNome').innerText = logado.toUpperCase();

        // Carregar Preços
        database.ref('precos').on('value', snap => {
            const p = snap.val();
            if(p){
                document.getElementById('v1').innerText = p.retirar.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
                document.getElementById('v2').innerText = p.armazem.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            }
        });

        // Carregar Histórico
        database.ref('compras').on('value', snap => {
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = "";
            snap.forEach(item => {
                const v = item.val();
                if(v.corretor === logado) {
                    lista.innerHTML = `
                        <div class="history-item">
                            <strong>${v.nome}</strong> | ${v.qtdSacas || v.qtd} sacas<br>
                            <small>${v.dataHr} - Status: ${v.status}</small>
                        </div>` + lista.innerHTML;
                }
            });
        });
    }

    function toggleHistorial() {
        const h = document.getElementById('listaHistorico');
        h.style.display = h.style.display === 'none' ? 'block' : 'none';
    }

    document.getElementById('formCompra').onsubmit = (e) => {
        e.preventDefault();
        const vSaca = parseFloat(document.getElementById('valorSaca').value.replace("R$ ","").replace(".","").replace(",","."));
        const data = {
            corretor: logado,
            nome: document.getElementById('nome').value,
            cpf: document.getElementById('cpf').value,
            sefaz: document.getElementById('sefaz').value,
            banco: document.getElementById('banco').value,
            agencia: document.getElementById('agencia').value,
            conta: document.getElementById('conta').value,
            qtdSacas: document.getElementById('qtdSacas').value,
            qtdKg: document.getElementById('qtdKg').value || 0,
            valorSaca: vSaca,
            armazem: document.getElementById('armazem').value,
            status: "PENDENTE",
            dataHr: new Date().toLocaleString('pt-BR')
        };
        database.ref('compras').push(data).then(() => {
            alert("Compra Registrada!");
            document.getElementById('formCompra').reset();
        });
    };
</script>
</body>
</html>
